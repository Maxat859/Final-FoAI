name: QAMAL Participant 2 Tests
on:
  push:
    branches: ["feature/csp-ml-education"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run demo:p2
