name: Publish QAMAL Game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'main.css'
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qamal-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and publish playable game
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
      - name: Set up Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify AI and game logic
        run: npm test
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html main.css _site/
          cp -R src assets data _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/src/main.js
          test -f _site/data/quest-questions.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload playable site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
