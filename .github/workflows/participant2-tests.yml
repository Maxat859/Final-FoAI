name: QAMAL Participant 2 Tests
on:
  push:
    branches: [sdda]
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'participant2-demo.*'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run demo:p2
