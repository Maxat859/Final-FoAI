name: QAMAL Combined Integration Checks
on:
  push:
    branches: [integration/qamal-final]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run demo:p2
      - run: node --check src/main.js
